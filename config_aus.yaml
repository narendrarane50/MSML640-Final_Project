# ===========================================
# CONFIG FILE FOR AU FEATURE MANAGEMENT
# ===========================================

# Root dataset directory (RAF-DB base)
dataset_root: "datasets/RAF-DB"

# -------------------------------
# Raw image and OpenFace outputs
# -------------------------------
# Folder containing original RAF-DB images
images_dir: "datasets/RAF-DB/DATASET"

# Folder where OpenFace extracted AUs for each image
# Example: OpenFace outputs contain files like `*_AU.csv`
openface_output_dir: "datasets/RAF-DB/OpenFace_AU_Outputs"

# -------------------------------
# AU feature aggregation
# -------------------------------
# Combined AU feature CSV file (after merging all per-image AUs)
# Must contain: path, AU01, AU02, ..., AU17
au_feature_csv: "datasets/RAF-DB/aus_features.csv"

# If you have multiple AU sources (e.g., cropped, frontal, etc.)
# you can list them here for experimentation
au_sources:
  - "datasets/RAF-DB/aus_features_pose_norm.csv"
  - "datasets/RAF-DB/aus_features_original.csv"

# -------------------------------
# Output paths for split CSVs
# -------------------------------
splits_dir: "splits"

# Base splits (from make_raf_splits_from_folders.py)
train_split_csv: "splits/rafdb_train.csv"
val_split_csv: "splits/rafdb_val.csv"

# AU-augmented splits (generated by make_raf_splits_with_aus.py)
train_split_with_aus: "splits/rafdb_train_with_aus.csv"
val_split_with_aus: "splits/rafdb_val_with_aus.csv"

# -------------------------------
# Optional backup or cache paths
# -------------------------------
cache_dir: "cache"
logs_dir: "logs/aus_processing"
